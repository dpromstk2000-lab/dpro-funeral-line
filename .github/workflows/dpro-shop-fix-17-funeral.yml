name: "DPRO SHOP Fix 17 FUNERAL"
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/dpro-shop-fix-17-funeral.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dpro-shop-fix-17-funeral"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited source SHA
        shell: bash
        run: |
          set -euo pipefail
          check() {
            path="$1"; expected="$2"
            test -f "$path" || { echo "Missing target: $path"; exit 31; }
            got="$(git hash-object "$path")"
            echo "$path  $got"
            test "$got" = "$expected" || { echo "SOURCE SHA MISMATCH: $path expected=$expected got=$got"; exit 32; }
          }
          check 'owner.html' 'a738bf4651ddb778720ad192036eb266ebd514bd'

      - name: Apply narrow confirmed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          
          def read(path):
              return Path(path).read_text(encoding="utf-8")
          
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          
          def replace_once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {n}")
              return text.replace(old,new,1)
          
          def sub_once(text, pattern, repl, label, flags=0):
              new,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {n}")
              return new
          
          p='owner.html'; t=read(p)
          # Narrow helper is based on endpoint family + explicit target fields only.
          anchor='''  async function api(path,{method='GET',body=null}={}){const headers={'X-Admin-Code':state.adminCode};'''
          helper='''  function allowHighImpactStatus(path,method,body){if(String(method||'GET').toUpperCase()==='GET'||!body)return true;const p=String(path||'').toLowerCase();const vals=[body.status,body.consultation_status,body.task_status,body.aftercare_status,body.memorial_status,body.product_status,body.case_status].filter(Boolean).map(String);const rules=[[/consult/,new Set(['completed','cancelled','no_show'])],[/task/,new Set(['done','completed','cancelled'])],[/aftercare/,new Set(['completed','not_needed','closed'])],[/(memorial|houyou|法要)/,new Set(['scheduled','completed','not_needed','cancelled','final_confirmed'])],[/(product|merchandise|goods)/,new Set(['ordered','completed','cancelled'])],[/case/,new Set(['completed','closed'])]];const hit=rules.some(([rx,set])=>rx.test(p)&&vals.some(v=>set.has(v)));return !hit||confirm(`重要な状態「${vals.join(' / ')}」へ変更しますか？`)}\n  async function api(path,{method='GET',body=null}={}){if(!allowHighImpactStatus(path,method,body)){const err=new Error('操作をキャンセルしました。');err.cancelled=true;throw err}const headers={'X-Admin-Code':state.adminCode};'''
          t=replace_once(t,anchor,helper,'FUNERAL API terminal guard')
          write(p,t)
          PY

      - name: Validate source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- "owner.html"
          if git diff --quiet -- "owner.html"; then
            echo "No source change was produced."
            exit 41
          fi

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "owner.html"
          git diff --cached --check
          git commit -m "Fix funeral high-impact status guards"
          git push origin HEAD:main
