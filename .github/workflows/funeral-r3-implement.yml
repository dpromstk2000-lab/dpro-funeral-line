name: FUNERAL R3 Tutorial Implement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/funeral-r3-implement.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify forward-only base and implement
        env:
          TUTORIAL_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$TUTORIAL_B64" | base64 -d > tutorial.js
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="./tutorial.js?v=funeral-r3-20260829-v1"></script>'
          for name in ['demo-guide.html','index.html','member.html','staff.html','owner.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'tutorial.js?v=funeral-r3-20260829-v1' not in s:
                  if '</body>' not in s:
                      raise SystemExit(f'missing </body> in {name}')
                  s=s.replace('</body>', f'  {tag}\n</body>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
          node --check tutorial.js
          grep -q 'DPRO_FUNERAL_TUTORIAL_R3_20260829_V1' tutorial.js
          for f in demo-guide.html index.html member.html staff.html owner.html; do grep -q 'tutorial.js?v=funeral-r3-20260829-v1' "$f"; done
          rm -f .github/workflows/funeral-r3-implement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tutorial.js demo-guide.html index.html member.html staff.html owner.html .github/workflows/funeral-r3-implement.yml
          git commit -m 'Implement FUNERAL R3 Tutorial First10 [skip ci]'
          git push origin HEAD:main
