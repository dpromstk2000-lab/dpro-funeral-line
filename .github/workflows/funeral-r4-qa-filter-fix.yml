name: FUNERAL R4 QA Filter Fix

on:
  push:
    paths:
      - '.github/workflows/funeral-r4-qa-filter-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funeral-r4-qa-filter-fix
  cancel-in-progress: false

jobs:
  live-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current R3 and R4 locks (read-only)
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          grep -q 'DPRO_FUNERAL_TUTORIAL_R3_20260829_V2' tutorial.js
          grep -q 'DPRO_FUNERAL_GUIDE_R4_20260829_V1' demo-guide.html
          grep -q 'window.DPRO_FUNERAL_GUIDE_CENTER' demo-guide.html
          test -z "$(git status --porcelain)"
          echo "R3/R4 forward-only locks verified; no product source changes."

      - name: Wait until R4 is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-funeral-line/demo-guide.html'
          for i in $(seq 1 72); do
            if curl -fsSL --max-time 20 "$URL?qa=$(date +%s)" | grep -q 'DPRO_FUNERAL_GUIDE_R4_20260829_V1'; then
              echo "R4 Guide Center is live."
              exit 0
            fi
            echo "Waiting for GitHub Pages... ${i}/72"
            sleep 10
          done
          echo 'R4 Guide Center did not become live within 12 minutes.' >&2
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run exact four-width R4 LIVE QA
        shell: bash
        run: |
          mkdir -p qa
          cat > qa/run-r4-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const BASE='https://dpromstk2000-lab.github.io/dpro-funeral-line/';
          const KEY='dpro_tutorial_funeral_v1';
          const EXPECTED_IDS=[
            'FUNERAL-FIRST10-01','FUNERAL-FIRST10-02','FUNERAL-FIRST10-03','FUNERAL-FIRST10-04','FUNERAL-FIRST10-05',
            'FUNERAL-FIRST10-06','FUNERAL-FIRST10-07','FUNERAL-FIRST10-08','FUNERAL-FIRST10-09','FUNERAL-FIRST10-10'
          ];
          const VIEWPORTS=[{w:1440,h:1000},{w:1024,h:768},{w:390,h:844},{w:320,h:720}];
          const report={system:'FUNERAL',batch:'08',stage:'R4',standard:'V1.1',generatedAt:new Date().toISOString(),viewports:[],global:{},failures:[]};
          const fail=(scope,msg)=>report.failures.push(`${scope}: ${msg}`);
          const pass=v=>v?'PASS':'FAIL';

          async function waitGuide(page){
            await page.waitForFunction(()=>window.DPRO_FUNERAL_TUTORIAL && window.DPRO_FUNERAL_GUIDE_CENTER && document.querySelectorAll('.guide-item').length===10,null,{timeout:20000});
          }
          async function waitCard(page,n){
            await page.waitForFunction((i)=>{
              const el=document.querySelector('#dpro-funeral-tutorial-card .dpro-tutorial-step');
              return !!el && el.textContent.includes(`STEP ${String(i).padStart(2,'0')} / 10`);
            },n,{timeout:20000});
          }
          async function gotoGuide(page){
            await page.goto(BASE+'demo-guide.html?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await waitGuide(page);
          }
          async function resetGuide(page){
            await gotoGuide(page);
            await page.evaluate(k=>{
              localStorage.removeItem(k);
              for(let i=1;i<=10;i++) localStorage.removeItem(`dpro_tutorial_funeral_first10_${String(i).padStart(2,'0')}`);
            },KEY);
            await page.reload({waitUntil:'domcontentloaded'});
            await waitGuide(page);
          }
          async function alignment(page){
            return page.evaluate(()=>{
              const T=window.DPRO_FUNERAL_TUTORIAL;
              const G=window.DPRO_FUNERAL_GUIDE_CENTER;
              const route=s=>{
                const p=new URLSearchParams();
                Object.entries(s.query||{}).forEach(([k,v])=>p.set(k,v));
                return s.route+(p.toString()?'?'+p.toString():'');
              };
              const tutorial=T.steps.map(s=>({
                id:s.id,route:route(s),primary:s.primary,fallbacks:s.fallback||[],title:s.title,instruction:s.instruction
              }));
              return {
                count:G.count,
                tutorialStorageKey:G.tutorialStorageKey,
                guide:G.getItems(),
                tutorial
              };
            });
          }
          async function overflow(page){
            return page.evaluate(()=>({
              innerWidth:innerWidth,
              documentElementScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body?.scrollWidth||0
            }));
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            let allAlign=true,allStart=true,allResume=true,allReplay=true,allFocus=true,allOverflow=true,allErrors=true,allWrites=true,allProduct=true;
            try{
              for(const vp of VIEWPORTS){
                const scope=`${vp.w}x${vp.h}`;
                const context=await browser.newContext({viewport:{width:vp.w,height:vp.h},hasTouch:vp.w<=390,isMobile:vp.w<=390});
                const page=await context.newPage();
                const vr={viewport:scope,checks:{},pageErrors:[],consoleErrors:[],externalProductConsoleErrors:[],unsafeWriteRequests:[]};
                let tracking=false;
                // Only Tutorial/Guide-attributable errors fail R4. Existing product/API console errors are notes.
                page.on('pageerror',e=>{
                  const text=String(e.stack||e.message||e);
                  if(/tutorial\.js|DPRO_FUNERAL_TUTORIAL|DPRO_FUNERAL_GUIDE|Guide Center|guide-center|dpro-funeral-tutorial/i.test(text)) vr.pageErrors.push(text);
                });
                page.on('console',m=>{
                  if(m.type()!=='error') return;
                  const location=m.location();
                  const text=m.text();
                  const attributable=/tutorial\.js/i.test(location.url||'') || /DPRO_FUNERAL_TUTORIAL|DPRO_FUNERAL_GUIDE|Guide Center|guide-center|dpro-funeral-tutorial/i.test(text);
                  if(attributable) vr.consoleErrors.push({text,location});
                  else vr.externalProductConsoleErrors.push({text,location});
                });
                page.on('request',r=>{if(tracking&&!['GET','HEAD','OPTIONS'].includes(r.method()))vr.unsafeWriteRequests.push({method:r.method(),url:r.url()});});
                try{
                  await resetGuide(page);
                  tracking=true;

                  const a=await alignment(page);
                  const alignOk=a.count===10 && a.tutorialStorageKey===KEY &&
                    JSON.stringify(a.guide)===JSON.stringify(a.tutorial.map((x,i)=>({index:i,...x}))) &&
                    JSON.stringify(a.guide.map(x=>x.id))===JSON.stringify(EXPECTED_IDS);
                  vr.checks.GUIDE_COUNT=pass(a.count===10);
                  vr.checks.GUIDE_TUTORIAL_ALIGNMENT=pass(alignOk);
                  if(!alignOk){allAlign=false;fail(scope,'Guide/Tutorial alignment mismatch '+JSON.stringify(a));}

                  // Product regression guards for the pre-existing public demo guide.
                  const product=await page.evaluate(()=>({
                    screens:document.querySelectorAll('#screenGrid .card').length,
                    flow:document.querySelectorAll('#flowGrid .flow-step').length,
                    primary:document.getElementById('primaryDemoLink')?.getAttribute('href')||'',
                    hero:!!document.querySelector('.hero'),
                    quickInfo:document.querySelectorAll('#quickInfo>div').length
                  }));
                  const productOk=product.screens===4&&product.flow===5&&product.primary==='index.html?demo=1'&&product.hero&&product.quickInfo===3;
                  vr.checks.PRODUCT_REGRESSION=pass(productOk);
                  if(!productOk){allProduct=false;fail(scope,'Product regression guard failed '+JSON.stringify(product));}

                  // Keyboard focus on Guide Center controls.
                  await page.locator('#guideStart').focus();
                  await page.keyboard.press('Tab');
                  const focus=await page.evaluate(()=>({
                    id:document.activeElement?.id||'',
                    outline:getComputedStyle(document.activeElement).outlineWidth
                  }));
                  const focusOk=['guideReplay','guideResume'].includes(focus.id)&&parseFloat(focus.outline)>0;
                  vr.checks.KEYBOARD_FOCUS=pass(focusOk);
                  if(!focusOk){allFocus=false;fail(scope,'Guide keyboard focus not visibly styled '+JSON.stringify(focus));}

                  // Start -> Step 1.
                  await page.locator('#guideStart').click();
                  await waitCard(page,1);
                  let st=await page.evaluate(()=>window.DPRO_FUNERAL_TUTORIAL.getState());
                  const startOk=st.active&&st.stepIndex===0;
                  vr.checks.START=pass(startOk);
                  if(!startOk){allStart=false;fail(scope,'Start did not open Step 1');}

                  // Move to Step 3, close, return to Guide, Resume -> same Step 3 across page.
                  await page.locator('[data-next]').click(); await waitCard(page,2);
                  await Promise.all([
                    page.waitForURL(/index\.html\?demo=1/,{timeout:20000}),
                    page.locator('[data-next]').click()
                  ]);
                  await page.waitForFunction(()=>window.DPRO_FUNERAL_TUTORIAL,null,{timeout:20000});
                  await waitCard(page,3);
                  await page.locator('[data-close]').click();
                  await gotoGuide(page);
                  await page.waitForFunction(()=>!document.getElementById('guideResume').hidden,null,{timeout:5000});
                  const resumeLabel=await page.locator('#guideResume').textContent();
                  await page.locator('#guideResume').click();
                  await page.waitForURL(/index\.html\?demo=1/,{timeout:20000});
                  await page.waitForFunction(()=>window.DPRO_FUNERAL_TUTORIAL,null,{timeout:20000});
                  await waitCard(page,3);
                  st=await page.evaluate(()=>window.DPRO_FUNERAL_TUTORIAL.getState());
                  const resumeOk=st.active&&st.stepIndex===2&&/3\/10/.test(resumeLabel||'');
                  vr.checks.RESUME=pass(resumeOk);
                  vr.checks.CROSS_PAGE_RESUME=pass(resumeOk);
                  if(!resumeOk){allResume=false;fail(scope,'Guide Resume did not restore Step 3');}

                  // Skip, return to Guide, Guide Replay -> Step 1.
                  await page.locator('[data-skip]').click();
                  await gotoGuide(page);
                  await page.locator('#guideReplay').click();
                  await waitCard(page,1);
                  st=await page.evaluate(()=>window.DPRO_FUNERAL_TUTORIAL.getState());
                  const replayOk=st.active&&st.stepIndex===0&&!st.skipped&&!st.completed;
                  vr.checks.REPLAY=pass(replayOk);
                  if(!replayOk){allReplay=false;fail(scope,'Guide Replay did not return to Step 1');}
                  await page.locator('[data-close]').click();
                  await gotoGuide(page);

                  const m=await overflow(page);
                  vr.metrics=m;
                  const overflowOk=m.documentElementScrollWidth<=m.innerWidth&&m.bodyScrollWidth<=m.innerWidth;
                  vr.checks.OVERFLOW=pass(overflowOk);
                  if(!overflowOk){allOverflow=false;fail(scope,'horizontal overflow '+JSON.stringify(m));}
                  if(vp.w===390||vp.w===320) vr.requiredWidthMetrics=m;

                  await page.screenshot({path:`qa/FUNERAL_R4_${vp.w}x${vp.h}.png`,fullPage:false});
                }catch(e){
                  vr.fatal=String(e.stack||e);
                  fail(scope,vr.fatal);
                }finally{
                  const errOk=vr.pageErrors.length===0&&vr.consoleErrors.length===0;
                  const writeOk=vr.unsafeWriteRequests.length===0;
                  vr.checks.PAGEERROR=pass(vr.pageErrors.length===0);
                  vr.checks.TUTORIAL_GUIDE_CONSOLE_ERROR=pass(vr.consoleErrors.length===0);
                  vr.checks.UNSAFE_WRITE_REQUEST=pass(writeOk);
                  vr.checks.BUSINESS_MUTATION=pass(writeOk);
                  if(!errOk){allErrors=false;fail(scope,'Tutorial/Guide-attributable page/console error '+JSON.stringify({pageErrors:vr.pageErrors,consoleErrors:vr.consoleErrors}));}
                  if(!writeOk){allWrites=false;fail(scope,'unsafe write request '+JSON.stringify(vr.unsafeWriteRequests));}
                  report.viewports.push(vr);
                  await context.close();
                }
              }
            }finally{await browser.close();}

            const by=Object.fromEntries(report.viewports.map(v=>[v.viewport,v]));
            const widthPass=w=>!report.failures.some(x=>x.startsWith(w+':'))&&by[w]?.checks?.OVERFLOW==='PASS';
            report.global={
              GUIDE_COUNT:10,
              GUIDE_COUNT_PASS:pass(report.viewports.every(v=>v.checks.GUIDE_COUNT==='PASS')),
              GUIDE_TUTORIAL_ALIGNMENT:pass(allAlign),
              START:pass(allStart),RESUME:pass(allResume),REPLAY:pass(allReplay),
              KEYBOARD_FOCUS:pass(allFocus),
              '1440x1000':pass(widthPass('1440x1000')),
              '1024x768':pass(widthPass('1024x768')),
              '390x844':pass(widthPass('390x844')),
              '320x720':pass(widthPass('320x720')),
              '390_INNER_WIDTH':by['390x844']?.requiredWidthMetrics?.innerWidth??null,
              '390_DOCUMENT_ELEMENT_SCROLL_WIDTH':by['390x844']?.requiredWidthMetrics?.documentElementScrollWidth??null,
              '390_BODY_SCROLL_WIDTH':by['390x844']?.requiredWidthMetrics?.bodyScrollWidth??null,
              '390_OVERFLOW':pass(by['390x844']?.checks?.OVERFLOW==='PASS'),
              '320_INNER_WIDTH':by['320x720']?.requiredWidthMetrics?.innerWidth??null,
              '320_DOCUMENT_ELEMENT_SCROLL_WIDTH':by['320x720']?.requiredWidthMetrics?.documentElementScrollWidth??null,
              '320_BODY_SCROLL_WIDTH':by['320x720']?.requiredWidthMetrics?.bodyScrollWidth??null,
              '320_OVERFLOW':pass(by['320x720']?.checks?.OVERFLOW==='PASS'),
              PAGEERROR:pass(allErrors),
              TUTORIAL_GUIDE_CONSOLE_ERROR:pass(allErrors),
              UNSAFE_WRITE_REQUEST:pass(allWrites),
              BUSINESS_MUTATION:pass(allWrites),
              PRODUCT_REGRESSION:pass(allProduct),
              EXTERNAL_PRODUCT_CONSOLE_ERROR_NOTE:report.viewports.reduce((n,v)=>n+(v.externalProductConsoleErrors?.length||0),0)
            };
            const required=['GUIDE_COUNT_PASS','GUIDE_TUTORIAL_ALIGNMENT','START','RESUME','REPLAY','KEYBOARD_FOCUS','1440x1000','1024x768','390x844','320x720','390_OVERFLOW','320_OVERFLOW','PAGEERROR','TUTORIAL_GUIDE_CONSOLE_ERROR','UNSAFE_WRITE_REQUEST','BUSINESS_MUTATION','PRODUCT_REGRESSION'];
            report.result=required.every(k=>report.global[k]==='PASS')&&report.failures.length===0?'PASS':'HOLD';
            fs.writeFileSync('qa/R4_QA_EVIDENCE.json',JSON.stringify(report,null,2));
            const lines=[
              'DPRO TUTORIAL BATCH-08 / FUNERAL / R4 GUIDE CENTER QA FILTER FIX',
              `RESULT=${report.result}`,
              ...Object.entries(report.global).map(([k,v])=>`${k}=${v}`),
              `FAILURE_COUNT=${report.failures.length}`,
              ...report.failures.map((x,i)=>`FAIL_${i+1}=${x.replace(/\n/g,' | ')}`)
            ];
            fs.writeFileSync('qa/R4_QA_EVIDENCE.txt',lines.join('\n')+'\n');
            console.log(lines.join('\n'));
            if(report.result!=='PASS')process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node qa/run-r4-qa.cjs

      - name: Upload R4 QA filter-fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FUNERAL_R4_QA_FILTER_FIX_EVIDENCE
          path: |
            qa/R4_QA_EVIDENCE.json
            qa/R4_QA_EVIDENCE.txt
            qa/FUNERAL_R4_*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary R4 QA filter-fix workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          if [ -f .github/workflows/funeral-r4-qa-filter-fix.yml ]; then
            git rm .github/workflows/funeral-r4-qa-filter-fix.yml
            git commit -m 'Remove FUNERAL R4 QA filter-fix workflow [skip ci]'
            git push origin main
          fi
